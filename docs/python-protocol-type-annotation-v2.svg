<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#273043" flood-opacity=".14"/>
    </filter>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#397f9f"/>
    </marker>
    <marker id="g" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2a9d8f"/>
    </marker>
    <style>
      .cn{font-family:"Microsoft YaHei","PingFang SC",sans-serif;fill:#252838}
      .code{font-family:Consolas,"Courier New",monospace;fill:#292c3b}
      .t{font-size:40px;font-weight:800}.pt{font-size:30px;font-weight:800}
      .ct{font-size:23px;font-weight:800}.b{font-size:20px;font-weight:500}
      .sm{font-size:17px;font-weight:500}.line{stroke:#343747;stroke-width:3}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#fbfaf6"/>
  <circle cx="58" cy="47" r="22" fill="#252738"/>
  <text x="58" y="56" text-anchor="middle" fill="#fff" font-size="24">⌘</text>
  <text x="800" y="60" text-anchor="middle" class="cn t">Python 类型标注：为什么具体 Repository 可以传给 Port？</text>
  <path d="M90 78H1510" stroke="#d8d2c7" stroke-width="3"/>

  <!-- two independent panels -->
  <rect x="35" y="98" width="735" height="545" rx="28" fill="#fff0e5" stroke="#e7a078" stroke-width="3"/>
  <rect x="830" y="98" width="735" height="545" rx="28" fill="#e9f7ec" stroke="#75b990" stroke-width="3"/>
  <line x1="800" y1="112" x2="800" y2="630" stroke="#747785" stroke-width="3" stroke-dasharray="10 9"/>

  <rect x="155" y="80" width="495" height="66" rx="18" fill="#f3a56d" class="line" filter="url(#s)"/>
  <text x="402" y="122" text-anchor="middle" class="cn pt">常见误解：标注 = 强制类型</text>

  <rect x="950" y="80" width="495" height="66" rx="18" fill="#7bc98e" class="line" filter="url(#s)"/>
  <text x="1198" y="122" text-anchor="middle" class="cn pt">正确理解：标注 = 所需能力</text>

  <!-- left: code -->
  <rect x="70" y="165" width="665" height="112" rx="20" fill="#fffaf6" class="line"/>
  <circle cx="102" cy="198" r="10" fill="#e76f51"/>
  <text x="125" y="207" class="cn ct">看到参数类型标注</text>
  <text x="95" y="247" class="code" font-size="19">def __init__(self, repository: ProfileRepositoryPort):</text>
  <text x="130" y="271" class="code" font-size="19">self.repository = repository</text>

  <!-- left: misconceptions -->
  <rect x="70" y="300" width="305" height="180" rx="20" fill="#fffaf6" class="line"/>
  <circle cx="103" cy="335" r="11" fill="#e76f51"/>
  <text x="127" y="343" class="cn ct">误解一</text>
  <text x="98" y="385" class="cn b">repository 的实际类型</text>
  <text x="98" y="419" class="cn b">必须“恰好等于”</text>
  <text x="98" y="454" class="code" font-size="18">ProfileRepositoryPort</text>

  <rect x="425" y="300" width="310" height="180" rx="20" fill="#fffaf6" class="line"/>
  <circle cx="458" cy="335" r="11" fill="#e76f51"/>
  <text x="482" y="343" class="cn ct">误解二</text>
  <text x="453" y="385" class="cn b">传入 ProfileRepository</text>
  <text x="453" y="419" class="cn b">就是“类型不一致”</text>
  <text x="453" y="454" class="cn sm">以为必须先转换成 Port</text>

  <!-- left: illustration and stamp -->
  <circle cx="205" cy="550" r="39" fill="#f4c7a4" class="line"/>
  <path d="M168 542Q205 490 242 542Q220 522 205 527Q186 522 168 542" fill="#343747"/>
  <circle cx="191" cy="551" r="4" fill="#343747"/><circle cx="219" cy="551" r="4" fill="#343747"/>
  <path d="M192 571Q205 561 218 571" fill="none" stroke="#343747" stroke-width="3"/>
  <path d="M162 630Q164 590 205 590Q246 590 248 630" fill="#ef8354" class="line"/>
  <path d="M168 602L127 565M242 602L282 565" fill="none" stroke="#343747" stroke-width="10" stroke-linecap="round"/>
  <text x="116" y="553" class="cn" font-size="42" font-weight="900">?</text>
  <text x="277" y="553" class="cn" font-size="42" font-weight="900">?</text>
  <g transform="rotate(-6 520 557)">
    <rect x="337" y="515" width="365" height="88" rx="12" fill="#fff8f3" stroke="#c85443" stroke-width="5"/>
    <text x="520" y="551" text-anchor="middle" class="cn ct" fill="#c85443">不是类型转换</text>
    <text x="520" y="582" text-anchor="middle" class="cn ct" fill="#c85443">也不是实例化</text>
  </g>

  <!-- right: protocol and implementation -->
  <rect x="866" y="165" width="300" height="205" rx="20" fill="#fafffb" class="line" filter="url(#s)"/>
  <rect x="888" y="186" width="256" height="47" rx="13" fill="#b9e7c4"/>
  <text x="1016" y="217" text-anchor="middle" class="code" font-size="20" font-weight="700">ProfileRepositoryPort</text>
  <text x="1016" y="268" text-anchor="middle" class="cn ct">Protocol：能力清单</text>
  <rect x="906" y="296" width="96" height="48" rx="12" fill="#fff" class="line"/>
  <rect x="1030" y="296" width="96" height="48" rx="12" fill="#fff" class="line"/>
  <text x="954" y="327" text-anchor="middle" class="code" font-size="19">save()</text>
  <text x="1078" y="327" text-anchor="middle" class="code" font-size="19">get()</text>

  <rect x="1230" y="165" width="300" height="205" rx="20" fill="#fafffb" class="line" filter="url(#s)"/>
  <rect x="1252" y="186" width="256" height="47" rx="13" fill="#b8dcef"/>
  <text x="1380" y="217" text-anchor="middle" class="code" font-size="20" font-weight="700">ProfileRepository</text>
  <text x="1380" y="268" text-anchor="middle" class="cn ct">SQLite：具体实现</text>
  <rect x="1270" y="296" width="96" height="48" rx="12" fill="#fff" class="line"/>
  <rect x="1394" y="296" width="96" height="48" rx="12" fill="#fff" class="line"/>
  <text x="1318" y="327" text-anchor="middle" class="code" font-size="19">save()</text>
  <text x="1442" y="327" text-anchor="middle" class="code" font-size="19">get()</text>

  <path d="M1218 266H1178" stroke="#2a9d8f" stroke-width="7" marker-end="url(#g)"/>
  <text x="1198" y="246" text-anchor="middle" class="cn sm" fill="#217b70">结构匹配</text>

  <!-- right: container, placed entirely below cards -->
  <rect x="885" y="400" width="625" height="210" rx="21" fill="#fafffb" class="line"/>
  <circle cx="920" cy="435" r="11" fill="#2a9d8f"/>
  <text x="945" y="444" class="cn ct">Container 把具体对象传给 UseCase</text>
  <rect x="915" y="468" width="565" height="86" rx="13" fill="#edf4f7" stroke="#78909c" stroke-width="2"/>
  <text x="940" y="503" class="code" font-size="19">repo = ProfileRepository(database)</text>
  <text x="940" y="535" class="code" font-size="19">case = ProfileUseCase(repository=repo)</text>
  <circle cx="929" cy="580" r="9" fill="#59b978"/>
  <text x="952" y="588" class="cn b">case.repository 仍然是 ProfileRepository 对象</text>

  <!-- conclusion owns a separate row; it cannot cover the panels -->
  <rect x="350" y="665" width="900" height="66" rx="20" fill="#fff" class="line" filter="url(#s)"/>
  <circle cx="390" cy="698" r="12" fill="#2a9d8f"/>
  <text x="800" y="708" text-anchor="middle" class="cn" font-size="27" font-weight="900">
    核心：不是“必须为同一个类”，而是“必须满足同一份契约”
  </text>

  <!-- architecture flow -->
  <rect x="35" y="750" width="1530" height="105" rx="24" fill="#fff" class="line" filter="url(#s)"/>
  <text x="70" y="785" class="cn sm" font-weight="800">实际调用链</text>
  <g class="cn" font-size="19" font-weight="700">
    <rect x="155" y="782" width="100" height="46" rx="13" fill="#e5eef7" class="line"/><text x="205" y="812" text-anchor="middle">API</text>
    <rect x="320" y="782" width="205" height="46" rx="13" fill="#ffe0c9" class="line"/><text x="422" y="812" text-anchor="middle">ProfileUseCase</text>
    <rect x="620" y="782" width="260" height="46" rx="13" fill="#dff4e4" class="line"/><text x="750" y="812" text-anchor="middle">ProfileRepositoryPort</text>
    <rect x="980" y="782" width="225" height="46" rx="13" fill="#d9edf7" class="line"/><text x="1092" y="812" text-anchor="middle">ProfileRepository</text>
    <rect x="1340" y="782" width="115" height="46" rx="13" fill="#ece9f8" class="line"/><text x="1397" y="812" text-anchor="middle">SQLite</text>
  </g>
  <path d="M265 805H305" stroke="#397f9f" stroke-width="5" marker-end="url(#a)"/>
  <path d="M535 805H605" stroke="#397f9f" stroke-width="5" marker-end="url(#a)"/>
  <path d="M965 805H895" stroke="#2a9d8f" stroke-width="5" marker-end="url(#g)"/>
  <path d="M1215 805H1325" stroke="#397f9f" stroke-width="5" marker-end="url(#a)"/>
  <text x="923" y="846" text-anchor="middle" class="cn sm" fill="#217b70">Container 注入具体实现</text>

  <text x="800" y="887" text-anchor="middle" class="cn sm" fill="#626775">
    类型标注描述“期望的兼容类型”；普通 Python 运行时默认不会自动转换，也不会强制检查实际类型。
  </text>
</svg>
