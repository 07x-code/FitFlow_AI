services:
  postgres:
    image: postgres:16.14-alpine3.23
    environment:
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow
      POSTGRES_DB: fitflow_dev
    ports:
      - "5432:5432"
    volumes:
      - fitflow_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitflow -d fitflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitflow_postgres_data: